<!DOCTYPE html>
<html lang="en">
<head>
    <title>AI Backlog Recommender</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<h1>Rate & Categorize Your Backlog <span id="unratedCount" style="font-size: 0.5em; color: #66c0f4; vertical-align: middle;">({{ unrated_count }} left to rate)</span> <button class="why-toggle" onclick="toggleSettings()">Settings</button></h1>
<div class="carousel-container" id="carousel">{{ carousel_html | safe }}</div>

<div id="settingsPanel" style="display: none; background: #1b2838; padding: 20px; border-radius: 8px; margin: 20px auto; max-width: 600px; border: 1px solid #2a475e;">
    <h3>User Configuration</h3>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <label>Steam ID:</label>
        <input type="text" id="conf_STEAM_ID" style="background: #2a475e; color: white; border: none; padding: 5px;">
        
        <label>CEDB User ID:</label>
        <input type="text" id="conf_CEDB_USER_ID" style="background: #2a475e; color: white; border: none; padding: 5px;">
        
        <label>Number of Categories:</label>
        <input type="number" id="conf_NUM_CATEGORIES" style="background: #2a475e; color: white; border: none; padding: 5px;">
        
        <label>Games per Category:</label>
        <input type="number" id="conf_GAMES_PER_CATEGORY" style="background: #2a475e; color: white; border: none; padding: 5px;">
        
        <label>Min Playtime (mins):</label>
        <input type="number" id="conf_MIN_PLAYTIME" style="background: #2a475e; color: white; border: none; padding: 5px;">
        
        <label>Carousel Size:</label>
        <input type="number" id="conf_CAROUSEL_SIZE" style="background: #2a475e; color: white; border: none; padding: 5px;">
        
        <label>Ignore Duration (days):</label>
        <input type="number" id="conf_IGNORE_DURATION_DAYS" style="background: #2a475e; color: white; border: none; padding: 5px;">
        
        <label>Up Next Duration (days):</label>
        <input type="number" id="conf_UP_NEXT_DURATION_DAYS" style="background: #2a475e; color: white; border: none; padding: 5px;">
        
        <label>Show Finished Games Column:</label>
        <select id="conf_SHOW_FINISHED" style="background: #2a475e; color: white; border: none; padding: 5px;">
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>
    </div>
    <div style="margin-top: 15px; text-align: right;">
        <button class="why-toggle" onclick="toggleSettings()">Cancel</button>
        <button class="why-toggle" style="background: #66c0f4; color: #121a25;" onclick="saveSettings()">Save & Reload</button>
    </div>
</div>

<button class="btn-submit" id="trainBtn" onclick="generateRecommendations()">Train AI & Re-Cluster</button>
<div class="loading-text" id="loading">AI is crunching the data... Please wait...</div>

<div class="board" id="results"></div>

<script>
    function updateGame(appid, action, btn, value = null) {
        let card = btn.closest('.rate-card') || btn.closest('.game-card');
        card.style.opacity = '0.5';

        const payload = {appid: appid, action: action};
        if (value !== null) payload.value = value;

        fetch('/update_game', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        }).then(() => {
            if (action !== 'rate' && action !== 'unfinish') {
                card.style.opacity = '0';
                setTimeout(() => card.remove(), 300);
                
                // Decrement count
                const countEl = document.getElementById('unratedCount');
                if (countEl) {
                    let current = parseInt(countEl.textContent.match(/\d+/)[0]);
                    if (current > 0) {
                        countEl.textContent = `(${current - 1} left to rate)`;
                    }
                }
            } else {
                card.style.opacity = '1';
            }
        });
    }

    function rateCard(appid, slider) {
        const val = parseInt(slider.value);
        slider.nextElementSibling.textContent = val;
        updateGame(appid, 'rate', slider, val);
    }

    function finishGame(appid, btn) {
        let card = btn.closest('.game-card');
        let ratingSlider = card.querySelector('input[type="range"]');
        let ratingValue = ratingSlider ? parseInt(ratingSlider.value) : 0;
        updateGame(appid, 'finish', btn, ratingValue);
    }

    function unfinishGame(appid, btn) {
        updateGame(appid, 'unfinish', btn);
        // We might want to reload recommendations to see it back in backlog,
        // or just let the user re-train. For now, just show it's done.
        setTimeout(() => {
            generateRecommendations();
        }, 500);
    }

    function toggleWhy(btn) {
        const box = btn.nextElementSibling;
        box.classList.toggle('open');
        btn.textContent = box.classList.contains('open') ? 'Hide' : 'Why?';
    }

    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');
        if (panel.style.display === 'none') {
            fetch('/settings')
                .then(res => res.json())
                .then(data => {
                    for (const key in data) {
                        const el = document.getElementById('conf_' + key);
                        if (el) el.value = data[key];
                    }
                    panel.style.display = 'block';
                });
        } else {
            panel.style.display = 'none';
        }
    }

    function saveSettings() {
        const keys = ['STEAM_ID', 'CEDB_USER_ID', 'NUM_CATEGORIES', 'GAMES_PER_CATEGORY', 'MIN_PLAYTIME', 'CAROUSEL_SIZE', 'IGNORE_DURATION_DAYS', 'UP_NEXT_DURATION_DAYS', 'SHOW_FINISHED'];
        const payload = {};
        keys.forEach(k => {
            payload[k] = document.getElementById('conf_' + k).value;
        });

        fetch('/settings', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        }).then(() => {
            location.reload();
        });
    }

    function generateRecommendations() {
        const trainBtn = document.getElementById('trainBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');

        trainBtn.disabled = true;
        loading.style.display = 'block';
        results.innerHTML = '';

        let ratings = {};
        document.querySelectorAll('.rate-slider').forEach(s => {
            let val = parseInt(s.value);
            if (val > 0) {
                ratings[s.getAttribute('data-appid')] = val;
            }
        });

        fetch('/recommend', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(ratings)
        })
            .then(res => res.json())
            .then((data) => {
                trainBtn.disabled = false;
                loading.style.display = 'none';
                results.innerHTML = data.results_html;
                document.getElementById('carousel').innerHTML = data.carousel_html;
                
                // Update count
                const countEl = document.getElementById('unratedCount');
                if (countEl && data.unrated_count !== undefined) {
                    countEl.textContent = `(${data.unrated_count} left to rate)`;
                }
            })
            .catch(err => {
                console.error("AI Training Failed:", err);
                trainBtn.disabled = false;
                loading.style.display = 'none';
                alert("Something went wrong with the AI training.");
            });
    }
</script>
</body>
</html>
