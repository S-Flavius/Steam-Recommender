<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Backlog Recommender</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<div class="main-container">
    <h1>
        Rate & Categorize Your Backlog
        <span id="unratedCount" style="font-size: 0.4em; color: var(--accent); opacity: 0.8;">({{ unrated_count }} left to rate)</span>
        <button class="why-toggle" onclick="openModal()" style="margin-left: auto; font-size: 0.6em; padding: 6px 15px;">Settings</button>
    </h1>
    
    <div class="carousel-container" id="carousel">{{ carousel_html | safe }}</div>
    
    <button class="btn-submit" id="trainBtn" onclick="generateRecommendations()">Train AI & Re-Cluster</button>
    <div class="loading-text" id="loading">AI is crunching the data... Please wait...</div>
    
    <div class="board" id="results">{{ results_html | safe }}</div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Settings</h3>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <div class="settings-grid">
            <label>Steam ID</label>
            <input type="text" id="conf_STEAM_ID">
            
            <label>CEDB User ID</label>
            <input type="text" id="conf_CEDB_USER_ID">
            
            <label>No. of Categories</label>
            <input type="number" id="conf_NUM_CATEGORIES">
            
            <label>Games / Category</label>
            <input type="number" id="conf_GAMES_PER_CATEGORY">
            
            <label>Min Playtime (m)</label>
            <input type="number" id="conf_MIN_PLAYTIME">
            
            <label>Carousel Size</label>
            <input type="number" id="conf_CAROUSEL_SIZE">
            
            <label>Ignore (days)</label>
            <input type="number" id="conf_IGNORE_DURATION_DAYS">
            
            <label>Up Next (days)</label>
            <input type="number" id="conf_UP_NEXT_DURATION_DAYS">
            
            <label>Show Finished</label>
            <select id="conf_SHOW_FINISHED">
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>
        </div>
        <div class="modal-footer">
            <button class="why-toggle" onclick="closeModal()">Cancel</button>
            <button class="why-toggle" style="background: var(--accent); color: white; border: none;" onclick="saveSettings()">Save & Reload</button>
        </div>
    </div>
</div>

<script>
    function updateGame(appid, action, btn, value = null) {
        let cards = document.querySelectorAll(`[data-appid="${appid}"]`);
        cards.forEach(card => card.style.opacity = '0.5');

        const payload = {appid: appid, action: action};
        if (value !== null) payload.value = value;

        fetch('/update_game', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        }).then(res => res.json()).then(data => {
            if (action !== 'rate' && action !== 'unfinish') {
                cards.forEach(card => {
                    card.style.opacity = '0';
                    setTimeout(() => card.remove(), 300);
                });
                
                // If it was "Up Next", we should probably trigger a re-recommendation
                // because it needs to move from carousel/somewhere to Top Games
                if (action === 'up_next') {
                    setTimeout(() => generateRecommendations(), 500);
                }

                // Update count from server
                const countEl = document.getElementById('unratedCount');
                if (countEl && data.unrated_count !== undefined) {
                    countEl.textContent = `(${data.unrated_count} left to rate)`;
                }
            } else {
                cards.forEach(card => {
                    card.style.opacity = '1';
                    
                    // Sync values across all cards of the same appid
                    if (action === 'rate' && value !== null) {
                        const slider = card.querySelector('.rate-slider') || card.querySelector('input[type="range"]');
                        if (slider) {
                            slider.value = value;
                            if (slider.nextElementSibling && slider.nextElementSibling.tagName === 'SPAN') {
                                slider.nextElementSibling.textContent = value;
                            }
                        }
                    }
                });
                
                // If we rated something 0 -> >0, unrated count might change
                const countEl = document.getElementById('unratedCount');
                if (countEl && data.unrated_count !== undefined) {
                    countEl.textContent = `(${data.unrated_count} left to rate)`;
                }
            }
        });
    }

    function rateCard(appid, slider) {
        const val = parseInt(slider.value);
        // Optimistically update all sliders with same appid
        let cards = document.querySelectorAll(`[data-appid="${appid}"]`);
        cards.forEach(card => {
            const s = card.querySelector('.rate-slider') || card.querySelector('input[type="range"]');
            if (s) {
                s.value = val;
                if (s.nextElementSibling && s.nextElementSibling.tagName === 'SPAN') {
                    s.nextElementSibling.textContent = val;
                }
            }
        });
        updateGame(appid, 'rate', slider, val);
    }

    function finishGame(appid, btn) {
        let cards = document.querySelectorAll(`[data-appid="${appid}"]`);
        let ratingValue = 0;
        // Try to find a rating value from any of the cards
        for (let card of cards) {
            let slider = card.querySelector('.rate-slider') || card.querySelector('input[type="range"]');
            if (slider) {
                ratingValue = parseInt(slider.value);
                break;
            }
        }
        updateGame(appid, 'finish', btn, ratingValue);
    }

    function unfinishGame(appid, btn) {
        let cards = document.querySelectorAll(`[data-appid="${appid}"]`);
        cards.forEach(card => card.style.opacity = '0.5');
        updateGame(appid, 'unfinish', btn);
        // We might want to reload recommendations to see it back in backlog,
        // or just let the user re-train. For now, just show it's done.
        setTimeout(() => {
            generateRecommendations();
        }, 500);
    }

    function toggleWhy(btn) {
        let card = btn.closest('.rate-card') || btn.closest('.game-card');
        let appid = card.getAttribute('data-appid');
        let cards = document.querySelectorAll(`[data-appid="${appid}"]`);
        
        const box = btn.nextElementSibling;
        const newState = !box.classList.contains('open');
        
        cards.forEach(c => {
            const b = c.querySelector('.why-box');
            const t = c.querySelector('.why-toggle');
            if (b) {
                if (newState) b.classList.add('open');
                else b.classList.remove('open');
            }
            if (t) {
                t.textContent = newState ? 'Hide' : 'Why?';
            }
        });
    }

    function openModal() {
        const modal = document.getElementById('settingsModal');
        fetch('/settings')
            .then(res => res.json())
            .then(data => {
                for (const key in data) {
                    const el = document.getElementById('conf_' + key);
                    if (el) el.value = data[key];
                }
                modal.style.display = 'block';
            });
    }

    function closeModal() {
        document.getElementById('settingsModal').style.display = 'none';
    }

    window.onclick = function(event) {
        const modal = document.getElementById('settingsModal');
        if (event.target == modal) {
            closeModal();
        }
    }

    function saveSettings() {
        const keys = ['STEAM_ID', 'CEDB_USER_ID', 'NUM_CATEGORIES', 'GAMES_PER_CATEGORY', 'MIN_PLAYTIME', 'CAROUSEL_SIZE', 'IGNORE_DURATION_DAYS', 'UP_NEXT_DURATION_DAYS', 'SHOW_FINISHED'];
        const payload = {};
        keys.forEach(k => {
            payload[k] = document.getElementById('conf_' + k).value;
        });

        fetch('/settings', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        }).then(() => {
            location.reload();
        });
    }

    function generateRecommendations() {
        const trainBtn = document.getElementById('trainBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');

        trainBtn.disabled = true;
        loading.style.display = 'block';
        results.innerHTML = '';

        let ratings = {};
        document.querySelectorAll('.rate-slider').forEach(s => {
            let val = parseInt(s.value);
            if (val > 0) {
                ratings[s.getAttribute('data-appid')] = val;
            }
        });

        fetch('/recommend', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(ratings)
        })
            .then(res => res.json())
            .then((data) => {
                trainBtn.disabled = false;
                loading.style.display = 'none';
                results.innerHTML = data.results_html;
                document.getElementById('carousel').innerHTML = data.carousel_html;
                
                // Update count
                const countEl = document.getElementById('unratedCount');
                if (countEl && data.unrated_count !== undefined) {
                    countEl.textContent = `(${data.unrated_count} left to rate)`;
                }
            })
            .catch(err => {
                console.error("AI Training Failed:", err);
                trainBtn.disabled = false;
                loading.style.display = 'none';
                alert("Something went wrong with the AI training.");
            });
    }
</script>
</body>
</html>
